<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
        <form method="post">
            {% csrf_token %}
            <h2 class="text-xl font-bold text-center mb-4">Change Password</h2>

            {% if error_message %}
                <p class="text-red-500 text-sm text-center mb-4">{{ error_message }}</p>
            {% endif %}

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Patient ID</label>
                <input type="text" name="patient_id" required class="w-full mt-1 p-2 border rounded">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">New Password</label>
                <input type="password" name="new_password" required class="w-full mt-1 p-2 border rounded">
            </div>

            <div class="mb-4">
                <label class="block text-sm font-medium mb-1">Confirm Password</label>
                <input type="password" name="confirm_password" required class="w-full mt-1 p-2 border rounded">
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Change Password</button>
        </form>
    </div>

</body>
</html>
